name: lgtmaybe

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/ask') ||
        startsWith(github.event.comment.body, '/describe') ||
        startsWith(github.event.comment.body, '/diagram')))
    runs-on: ubuntu-latest
    steps:
      # Read configuration from the trusted base branch; never execute PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: MattJColes/lgtmaybe@4efda46ecb1fba574c5716f33e2e1b87c6880d74 # v2.11.0
        with:
          image: ghcr.io/mattjcoles/lgtmaybe@sha256:e56b2b03938ba46b0c5bf5d2cd632399bf9e8114d9fd4243b83b5e054325f914 # v2.11.0 linux/amd64
          provider: openai-compatible
          api_base: https://api.tanjs.dev/v1/
          api_key: ${{ secrets.LGTMAYBE_API_KEY }}
          # DeepSeek's OpenCode Go route rejects response_format.
          structured_output: false
          # openai-compatible defaults to a 16384-token cap shared with reasoning; 0 removes it.
          max_tokens: "0"
          # CLIProxyAPI suffixes select reasoning effort independently per role.
          triage_model: opencode-go/deepseek-v4.1-flash(max)
          model: opencode-go/deepseek-v4.1-flash(max)
          reflect_model: gpt-6.1-sol(high)
          fallback_model: opencode-go/glm-5.3-flash(max)
