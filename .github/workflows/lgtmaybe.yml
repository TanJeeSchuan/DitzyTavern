name: lgtmaybe

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/improve') ||
        contains(github.event.comment.body, '/ask') ||
        contains(github.event.comment.body, '/describe') ||
        contains(github.event.comment.body, '/diagram')))
    runs-on: ubuntu-latest
    steps:
      # Read configuration from the trusted base branch; never execute PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: MattJColes/lgtmaybe@4efda46ecb1fba574c5716f33e2e1b87c6880d74 # v2.11.0
        with:
          image: ghcr.io/mattjcoles/lgtmaybe:2.11.0
          provider: openai-compatible
          api_base: https://api.tanjs.dev/v1/
          api_key: ${{ secrets.LGTMAYBE_API_KEY }}
          # DeepSeek's OpenCode Go route rejects response_format.
          structured_output: false
          # Shared with reasoning: 16384 truncated every lens, while uncapped lenses can reason for 30+ minutes
          # without answering. Truncation triggers lgtmaybe's lower-effort retry; a timeout returns nothing.
          max_tokens: "65536"
          # CLIProxyAPI model suffixes override the request's reasoning_effort, so suffixed roles never step down.
          triage_model: opencode-go/deepseek-v4.1-flash(max)
          reflect_model: gpt-6.1-sol(high)
          # Unsuffixed so a truncated lens can retry at a lower reasoning_effort, then with reasoning off.
          model: opencode-go/deepseek-v4.1-flash
          fallback_model: opencode-go/glm-5.3-flash
          reasoning_effort: xhigh
