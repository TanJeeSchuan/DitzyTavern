name: nitpi-reviewer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      command:
        description: Review command
        type: choice
        default: review
        options: [review, review-clean, review-cancel]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: nitpi-review-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NITPI_INPUT_MODE: manual
  NITPI_INPUT_PRIMARY_BASE_URL: https://api.tanjs.dev/v1/
  NITPI_INPUT_PRIMARY_MODEL_ID: opencode-go/deepseek-v4.1-flash(max)
  NITPI_INPUT_RE_REVIEW_BASE_URL: https://api.tanjs.dev/v1/
  NITPI_INPUT_RE_REVIEW_MODEL_ID: gpt-6.1-sol(high)
  NITPI_INPUT_STORAGE_BASE_URL: http://100.100.175.73:51733

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(fromJSON('["/review", "/review clean", "/review cancel"]'), github.event.comment.body))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out trusted repository instructions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned NitPi engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TanJeeSchuan/NitPi
          ref: 1b1b67cde8c8c971100c4625bda0e0353b4d15cf
          path: nitpi
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nitpi/package-lock.json

      - name: Install NitPi
        working-directory: nitpi
        run: npm ci

      - name: Pin the repository instructions revision
        working-directory: subject
        run: echo "NITPI_INPUT_REVIEW_INSTRUCTIONS_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch the review subject as git objects
        if: github.event_name != 'pull_request_target'
        working-directory: subject
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "refs/pull/$PR_NUMBER/head"

      - name: Join the tailnet
        env:
          TS_AUTHKEY: ${{ secrets.NITPI_TAILSCALE_OAUTH_SECRET }}
          TS_HOSTNAME: nitpi-gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --auth-key="$TS_AUTHKEY?ephemeral=true&preauthorized=true" \
            --hostname="$TS_HOSTNAME" \
            --advertise-tags=tag:ci-nitpi-reviewer \
            --accept-dns=false

      - name: Deliver the event to NitPi
        working-directory: subject
        env:
          NITPI_ACTION: ${{ github.event_name == 'pull_request_target' && 'pull-request' || 'issue-comment' }}
          NITPI_INPUT_COMMAND: ${{ inputs.command || (github.event.comment.body == '/review clean' && 'review-clean' || github.event.comment.body == '/review cancel' && 'review-cancel' || 'review') }}
          NITPI_INPUT_PR_ACTION: ${{ github.event.action }}
          NITPI_INPUT_PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
          NITPI_DELIVERY_ID: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || format('pr-{0}-{1}-{2}', github.event.pull_request.number, github.event.action, github.event.pull_request.head.sha) }}
          NITPI_SECRET_PRIMARY_API_KEY: ${{ secrets.NITPI_PRIMARY_API_KEY }}
          NITPI_SECRET_RE_REVIEW_API_KEY: ${{ secrets.NITPI_RE_REVIEW_API_KEY }}
          NITPI_SECRET_STORAGE_AUTH_KEY: ${{ secrets.NITPI_STORAGE_AUTH_KEY }}
          NITPI_SECRET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NITPI_REVIEW_INSTRUCTIONS_FILE: ${{ github.workspace }}/subject/.nitpi/review-instructions.md
        run: ../nitpi/node_modules/.bin/tsx ../nitpi/actions/entry.mts

      - name: Leave the tailnet
        if: always()
        run: |
          if command -v tailscale >/dev/null; then sudo tailscale logout; fi
